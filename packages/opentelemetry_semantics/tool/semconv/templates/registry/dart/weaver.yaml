params:
  semconv_version: unknown
  registry_commit: unknown
  registry_describe: unknown
  type_suffix: ""
  # Everything the registry does not call `stable`. `exclude_stability`
  # drops both whole conventions and individual value members, so a
  # stable attribute keeps only its stable values (http.request.method
  # loses QUERY here and keeps it in the incubating library) -- the same
  # cut semantic-conventions-java makes.
  # Every level docs/non-normative/code-generation.md enumerates except
  # `stable`, plus `deprecated`. v1.44.0 uses no `beta` convention, but
  # leaving it out would silently leak one into the stable library on a
  # registry bump. stability_split_test.dart is the backstop if the
  # registry ever adds a level this list does not name.
  unstable:
    ["development", "alpha", "beta", "release_candidate", "deprecated"]

whitespace_control:
  trim_blocks: true
  lstrip_blocks: true

comment_formats:
  dart:
    format: markdown
    prefix: "/// "
    trim: true
    word_wrap:
      line_length: 76
default_comment_format: dart

text_maps:
  # PascalCase namespace names that clash with dart:core / dart:io /
  # package:web / Flutter widgets types get an `Attributes` suffix.
  # Unmapped names pass through unchanged.
  enum_name_overrides:
    Container: ContainerAttributes
    Error: ErrorAttributes
    Event: EventAttributes
    Exception: ExceptionAttributes
    File: FileAttributes
    Process: ProcessAttributes
    State: StateAttributes
  # Same idea for VALUE enums (named PascalCase of the full attribute
  # id): the registry's bare legacy `state` attribute would otherwise
  # emit `enum State`, colliding with Flutter's State<T>.
  value_enum_name_overrides:
    State: StateValue
  # Weaver instrument kind -> SemanticInstrument member.
  instrument_map:
    counter: counter
    updowncounter: upDownCounter
    gauge: gauge
    histogram: histogram
  # Dart reserved words that occur as enum-member identifiers get a `$`
  # suffix. `values`/`index` are defensive (illegal enum constants).
  reserved_words:
    default: default$
    new: new$
    in: in$
    values: values$
    index: index$

templates:
  - pattern: attributes.dart.j2
    filter: >-
      semconv_grouped_attributes({"exclude_stability": $unstable})
    application_mode: each
    file_name: "{{ ctx.root_namespace | snake_case }}.dart"

  - pattern: metrics.dart.j2
    # A metric defined once and `ref:`d by several groups (hw.status and
    # hw.errors are ref'd by every hardware device file) arrives here once
    # per referencing group. They are the same instrument — same name, same
    # kind, same unit — so collapse them, or the enum emits the identifier
    # 15 times and will not compile.
    filter: >-
      semconv_grouped_metrics({"exclude_stability": $unstable})
      | map(. + {metrics: (.metrics | unique_by(.metric_name))})
    application_mode: each
    file_name: "metrics/{{ ctx.root_namespace | snake_case }}_metrics.dart"

  - pattern: events.dart.j2
    filter: >-
      .groups
      | map(select(.type == "event" and .stability == "stable"))
      | map(. + {root_namespace: (.name | split(".") | .[0])})
      | group_by(.root_namespace)
      | map({root_namespace: .[0].root_namespace, events: (. | sort_by(.name))})
    application_mode: each
    file_name: "events/{{ ctx.root_namespace | snake_case }}_events.dart"

  - pattern: entities.dart.j2
    filter: >-
      .groups
      | map(select(.type == "entity" and .stability == "stable"))
      | map(. + {root_namespace: (.name | split(".") | .[0]),
                 identifying: [.attributes[]? | select(.role == "identifying" and .stability == "stable") | .name],
                 descriptive: [.attributes[]? | select((.role // "descriptive") != "identifying" and .stability == "stable") | .name]})
      | group_by(.root_namespace)
      | map({root_namespace: .[0].root_namespace,
             entities: (. | sort_by(.name)),
             attr_roots: ([.[] | .attributes[]? | select(.stability == "stable") | .name | split(".")[0]] | unique)})
    application_mode: each
    file_name: "entities/{{ ctx.root_namespace | snake_case }}_entities.dart"

  - pattern: registry.dart.j2
    filter: >-
      {
        attr_groups: semconv_grouped_attributes({"exclude_stability": $unstable}),
        metric_roots: (semconv_grouped_metrics({"exclude_stability": $unstable}) | map(.root_namespace)),
        event_roots: (.groups | map(select(.type == "event" and .stability == "stable")) | map(.name | split(".") | .[0]) | unique),
        entity_roots: (.groups | map(select(.type == "entity" and .stability == "stable")) | map(.name | split(".") | .[0]) | unique)
      }
      | . + {imports: (((.attr_groups | map("\(.root_namespace).dart"))
            + (.metric_roots | map("metrics/\(.)_metrics.dart"))
            + (.event_roots | map("events/\(.)_events.dart"))
            + (.entity_roots | map("entities/\(.)_entities.dart"))) | sort)}
    application_mode: single
    file_name: semconv_registry.dart

  - pattern: barrel.dart.j2
    filter: >-
      {
        attr_roots: (semconv_grouped_attributes({"exclude_stability": $unstable}) | map(.root_namespace)),
        metric_roots: (semconv_grouped_metrics({"exclude_stability": $unstable}) | map(.root_namespace)),
        event_roots: (.groups | map(select(.type == "event" and .stability == "stable")) | map(.name | split(".") | .[0]) | unique),
        entity_roots: (.groups | map(select(.type == "entity" and .stability == "stable")) | map(.name | split(".") | .[0]) | unique)
      }
      | {exports: (((.attr_roots | map("\(.).dart"))
            + (.metric_roots | map("metrics/\(.)_metrics.dart"))
            + (.event_roots | map("events/\(.)_events.dart"))
            + (.entity_roots | map("entities/\(.)_entities.dart"))
            + ["semconv_registry.dart"]) | sort)}
    application_mode: single
    file_name: semconv.dart
